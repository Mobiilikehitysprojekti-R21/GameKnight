name: Update architecture diagram

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # manual button in the UI

jobs:
  diagram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx depcruise . --config .dependency-cruiser.js --output-type mermaid > docs/architecture.mmd
      - run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/architecture.mmd
          git diff --cached --quiet || (git commit -m "chore: update architecture diagram" && git push)
